name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data, version, changelog and cache list
        run: node scripts/validate.mjs
      - name: Require a version bump when the app changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- index.html sw.js manifest.webmanifest assets data)
          if [ -z "$changed" ]; then echo "No app files changed"; exit 0; fi
          old=$(git show "$BASE:version.js" 2>/dev/null | grep -oE "APP_VERSION = '[0-9.]+'" || true)
          new=$(grep -oE "APP_VERSION = '[0-9.]+'" version.js)
          echo "base: ${old:-none}  head: $new"
          if [ "$old" = "$new" ]; then
            echo "::error::App files changed but APP_VERSION was not bumped. Run: node scripts/bump-version.mjs patch|minor|major"
            exit 1
          fi
      - name: Unit tests
        run: node --test 'tests/unit/*.test.mjs'

  smoke:
    # Every tab and game mode in a real browser (iPhone and iPad sizes, light and dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright with Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node tests/smoke.mjs
